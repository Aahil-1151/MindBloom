<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Create Account — MindBloom</title>

  <link rel="stylesheet" href="../styles/variables.css" />
  <link rel="stylesheet" href="../styles/global.css" />
  <link rel="stylesheet" href="../styles/animations.css" />
  <link rel="stylesheet" href="../styles/components.css" />
  <link rel="stylesheet" href="../styles/responsive.css" />
  <link rel="stylesheet" href="../styles/pages/auth.css" />
</head>
<body>
  <div id="app" class="auth-shell">
    <main class="auth-page">
      <div class="auth-blob auth-blob--one" aria-hidden="true"></div>
      <div class="auth-blob auth-blob--two" aria-hidden="true"></div>

      <section class="auth-card card card--glass anim-fade-up">
        <div class="auth-brand">
          <div class="auth-brand__mark"><svg class="icon" aria-hidden="true"><use href="../assets/icons/icons.svg#icon-leaf"></use></svg></div>
          <h1 class="auth-brand__name">MindBloom</h1>
          <p class="auth-brand__tagline">Your wellbeing, all in one place.</p>
        </div>

        <h2 class="auth-heading">Create your account</h2>
        <p class="auth-subheading">A few seconds, and Bloom is ready for you.</p>

        <div id="signup-message" class="form-message" role="alert" hidden></div>

        <form id="signup-form" class="stack" style="--stack-gap: var(--space-4);" novalidate>
          <div class="field" data-field="name">
            <label class="field__label" for="signup-name">Name</label>
            <input
              class="input"
              type="text"
              id="signup-name"
              name="name"
              placeholder="What should Bloom call you?"
              autocomplete="name"
              required
            />
            <span class="field__error"></span>
          </div>

          <div class="field" data-field="email">
            <label class="field__label" for="signup-email">Email</label>
            <input
              class="input"
              type="email"
              id="signup-email"
              name="email"
              placeholder="you@example.com"
              autocomplete="email"
              required
            />
            <span class="field__error"></span>
          </div>

          <div class="field" data-field="password">
            <label class="field__label" for="signup-password">Password</label>
            <div class="input-with-action">
              <input
                class="input"
                type="password"
                id="signup-password"
                name="password"
                placeholder="At least 8 characters"
                autocomplete="new-password"
                required
              />
              <button
                type="button"
                class="input-action"
                id="signup-password-toggle"
                aria-pressed="false"
              >
                Show
              </button>
            </div>
            <div class="password-strength">
              <div class="password-strength__track">
                <div class="password-strength__fill" id="password-strength-fill"></div>
              </div>
              <span class="password-strength__label" id="password-strength-label"></span>
            </div>
            <span class="field__error"></span>
          </div>

          <div class="field" data-field="confirmPassword">
            <label class="field__label" for="signup-confirm-password">Confirm password</label>
            <input
              class="input"
              type="password"
              id="signup-confirm-password"
              name="confirmPassword"
              placeholder="Re-enter your password"
              autocomplete="new-password"
              required
            />
            <span class="field__error"></span>
          </div>

          <button type="submit" class="btn btn--primary btn--full" id="signup-submit">
            Create account
          </button>
        </form>

        <div class="auth-divider"><span>or</span></div>

        <p class="auth-switch">
          Already have an account?
          <a href="login.html" class="auth-link auth-link--strong">Sign in</a>
        </p>
      </section>
    </main>
  </div>

  <script src="../scripts/validation.js"></script>
  <script src="../scripts/auth.js"></script>
  <script>
    document.addEventListener("DOMContentLoaded", function () {
      MindBloomAuthPages.initSignupPage();
    });
  </script>
</body>
</html>
