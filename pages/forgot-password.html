<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <link rel="stylesheet" href="../styles/fonts.css" />
  <title>Reset Password — MindBloom</title>

  <link rel="stylesheet" href="../styles/variables.css" />
  <link rel="stylesheet" href="../styles/global.css" />
  <link rel="stylesheet" href="../styles/animations.css" />
  <link rel="stylesheet" href="../styles/components.css" />
  <link rel="stylesheet" href="../styles/responsive.css" />
  <link rel="stylesheet" href="../styles/pages/auth.css" />
</head>
<body>
  <div id="app" class="auth-shell">
    <main class="auth-page">
      <div class="auth-blob auth-blob--one" aria-hidden="true"></div>
      <div class="auth-blob auth-blob--two" aria-hidden="true"></div>

      <section class="auth-card card card--glass anim-fade-up">
        <div class="auth-brand">
          <div class="auth-brand__mark"><svg class="icon" aria-hidden="true"><use href="../assets/icons/icons.svg#icon-leaf"></use></svg></div>
          <h1 class="auth-brand__name">MindBloom</h1>
          <p class="auth-brand__tagline">Your wellbeing, all in one place.</p>
        </div>

        <a href="login.html" class="auth-back-link"><svg class="icon icon--sm" aria-hidden="true"><use href="../assets/icons/icons.svg#icon-chevron-left"></use></svg> Back to sign in</a>

        <!-- STEP 1: request reset by email -->
        <div id="request-step" class="auth-step">
          <h2 class="auth-heading">Forgot your password?</h2>
          <p class="auth-subheading">Enter your email and we'll help you reset it.</p>

          <div id="request-message" class="form-message" role="alert" hidden></div>

          <form id="request-form" class="stack" style="--stack-gap: var(--space-4);" novalidate>
            <div class="field" data-field="email">
              <label class="field__label" for="forgot-email">Email</label>
              <input
                class="input"
                type="email"
                id="forgot-email"
                name="email"
                placeholder="you@example.com"
                autocomplete="email"
                required
              />
              <span class="field__error"></span>
            </div>

            <button type="submit" class="btn btn--primary btn--full" id="request-submit">
              Send reset link
            </button>
          </form>
        </div>

        <!-- STEP 2: set new password (shown after step 1 completes) -->
        <div id="reset-step" class="auth-step" hidden>
          <h2 class="auth-heading">Set a new password</h2>
          <p class="auth-subheading">Choose a strong password for your account.</p>

          <div id="reset-message" class="form-message" role="alert" hidden></div>

          <form id="reset-form" class="stack" style="--stack-gap: var(--space-4);" novalidate>
            <div class="field" data-field="password">
              <label class="field__label" for="new-password">New password</label>
              <input
                class="input"
                type="password"
                id="new-password"
                name="password"
                placeholder="At least 8 characters"
                autocomplete="new-password"
                required
              />
              <span class="field__error"></span>
            </div>

            <div class="field" data-field="confirmPassword">
              <label class="field__label" for="confirm-new-password">Confirm new password</label>
              <input
                class="input"
                type="password"
                id="confirm-new-password"
                name="confirmPassword"
                placeholder="Re-enter your new password"
                autocomplete="new-password"
                required
              />
              <span class="field__error"></span>
            </div>

            <button type="submit" class="btn btn--primary btn--full" id="reset-submit">
              Update password
            </button>
          </form>
        </div>
      </section>
    </main>
  </div>

  <script src="../scripts/validation.js"></script>
  <script src="../scripts/auth.js"></script>
  <script>
    document.addEventListener("DOMContentLoaded", function () {
      MindBloomAuthPages.initForgotPasswordPage();
    });
  </script>
</body>
</html>
