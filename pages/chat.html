<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Bloom AI Chat — MindBloom</title>

  <link rel="stylesheet" href="../styles/variables.css" />
  <link rel="stylesheet" href="../styles/global.css" />
  <link rel="stylesheet" href="../styles/animations.css" />
  <link rel="stylesheet" href="../styles/components.css" />
  <link rel="stylesheet" href="../styles/shell.css" />
  <link rel="stylesheet" href="../styles/responsive.css" />
  <link rel="stylesheet" href="../styles/pages/chat.css" />
</head>
<body class="chat-body">
  <div id="app" class="chat-shell">

    <!-- ============ SIDEBAR (tablet/desktop) ============ -->
    <aside class="sidebar hide-mobile" id="sidebar">
      <div class="sidebar__brand">
        <div class="auth-brand__mark"><svg class="icon" aria-hidden="true"><use href="../assets/icons/icons.svg#icon-leaf"></use></svg></div>
        <span class="sidebar__brand-name">MindBloom</span>
      </div>

      <nav class="sidebar__nav">
        <a href="dashboard.html" class="sidebar__link" data-nav="home">
          <span class="sidebar__icon"><svg class="icon" aria-hidden="true"><use href="../assets/icons/icons.svg#icon-home"></use></svg></span> Home
        </a>
        <a href="physical.html" class="sidebar__link" data-nav="wellbeing">
          <span class="sidebar__icon"><svg class="icon" aria-hidden="true"><use href="../assets/icons/icons.svg#icon-heart"></use></svg></span> Wellbeing
        </a>
        <a href="planner.html" class="sidebar__link" data-nav="academic">
          <span class="sidebar__icon"><svg class="icon" aria-hidden="true"><use href="../assets/icons/icons.svg#icon-cap"></use></svg></span> Academic
        </a>
        <a href="chat.html" class="sidebar__link" data-nav="bloom">
          <span class="sidebar__icon"><svg class="icon" aria-hidden="true"><use href="../assets/icons/icons.svg#icon-chat"></use></svg></span> Bloom AI
        </a>
        <a href="analytics.html" class="sidebar__link" data-nav="insights">
          <span class="sidebar__icon"><svg class="icon" aria-hidden="true"><use href="../assets/icons/icons.svg#icon-chart"></use></svg></span> Insights
        </a>
        <a href="settings.html" class="sidebar__link" data-nav="settings">
          <span class="sidebar__icon"><svg class="icon" aria-hidden="true"><use href="../assets/icons/icons.svg#icon-settings"></use></svg></span> Settings
        </a>
      </nav>

      <button class="sidebar__logout" id="sidebar-logout">
        <svg class="icon" aria-hidden="true"><use href="../assets/icons/icons.svg#icon-logout"></use></svg> Log out
      </button>
    </aside>

    <div class="chat-main">

    <header class="top-header chat-header">
      <a href="dashboard.html" class="btn btn--icon hide-desktop" aria-label="Back to dashboard"><svg class="icon" aria-hidden="true"><use href="../assets/icons/icons.svg#icon-chevron-left"></use></svg></a>

      <div class="chat-header__info">
        <span class="chat-avatar chat-avatar--header"><svg class="icon" aria-hidden="true"><use href="../assets/icons/icons.svg#icon-leaf"></use></svg></span>
        <div class="chat-header__text">
          <p class="chat-header__name">Bloom</p>
          <p class="chat-header__status" id="chat-status">Your wellbeing companion</p>
        </div>
      </div>

      <button class="btn btn--icon" id="chat-clear" aria-label="Clear conversation" type="button"><svg class="icon" aria-hidden="true"><use href="../assets/icons/icons.svg#icon-trash"></use></svg></button>
    </header>

    <main class="chat-page">
      <ul class="chat-messages" id="chat-messages" aria-live="polite" aria-label="Conversation with Bloom"></ul>
    </main>

    <div class="chat-suggestions" id="chat-suggestions" aria-label="Suggested replies"></div>

    <form class="chat-input-bar" id="chat-form">
      <textarea
        class="chat-input"
        id="chat-input"
        name="message"
        placeholder="Message Bloom…"
        rows="1"
        aria-label="Message Bloom"
      ></textarea>
      <button type="submit" class="chat-send" id="chat-send" aria-label="Send message">
        <svg class="icon" aria-hidden="true"><use href="../assets/icons/icons.svg#icon-send"></use></svg>
      </button>
    </form>

    </div>
  </div>

  <div id="toast-root" class="toast-root"></div>

  <script src="../scripts/core/utils.js"></script>
  <script src="../scripts/auth.js"></script>
  <script src="../scripts/chat-history.js"></script>
  <script src="../scripts/prompt-manager.js"></script>
  <script src="../scripts/conversation-ui.js"></script>
  <script src="../scripts/chat.js"></script>
</body>
</html>
