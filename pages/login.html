<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Sign In — MindBloom</title>

  <link rel="stylesheet" href="../styles/variables.css" />
  <link rel="stylesheet" href="../styles/global.css" />
  <link rel="stylesheet" href="../styles/animations.css" />
  <link rel="stylesheet" href="../styles/components.css" />
  <link rel="stylesheet" href="../styles/responsive.css" />
  <link rel="stylesheet" href="../styles/pages/auth.css" />
</head>
<body>
  <div id="app" class="auth-shell">
    <main class="auth-page">
      <div class="auth-blob auth-blob--one" aria-hidden="true"></div>
      <div class="auth-blob auth-blob--two" aria-hidden="true"></div>

      <section class="auth-card card card--glass anim-fade-up">
        <div class="auth-brand">
          <div class="auth-brand__mark"><svg class="icon" aria-hidden="true"><use href="../assets/icons/icons.svg#icon-leaf"></use></svg></div>
          <h1 class="auth-brand__name">MindBloom</h1>
          <p class="auth-brand__tagline">Your wellbeing, all in one place.</p>
        </div>

        <h2 class="auth-heading">Welcome back</h2>
        <p class="auth-subheading">Sign in to continue your journey.</p>

        <div id="login-message" class="form-message" role="alert" hidden></div>

        <form id="login-form" class="stack" style="--stack-gap: var(--space-4);" novalidate>
          <div class="field" data-field="email">
            <label class="field__label" for="login-email">Email</label>
            <input
              class="input"
              type="email"
              id="login-email"
              name="email"
              placeholder="you@example.com"
              autocomplete="email"
              required
            />
            <span class="field__error"></span>
          </div>

          <div class="field" data-field="password">
            <label class="field__label" for="login-password">Password</label>
            <div class="input-with-action">
              <input
                class="input"
                type="password"
                id="login-password"
                name="password"
                placeholder="Enter your password"
                autocomplete="current-password"
                required
              />
              <button
                type="button"
                class="input-action"
                id="login-password-toggle"
                aria-pressed="false"
              >
                Show
              </button>
            </div>
            <span class="field__error"></span>
          </div>

          <div class="row auth-row-between">
            <a href="forgot-password.html" class="auth-link">Forgot password?</a>
          </div>

          <button type="submit" class="btn btn--primary btn--full" id="login-submit">
            Sign in
          </button>
        </form>

        <div class="auth-divider"><span>or</span></div>

        <p class="auth-switch">
          Don't have an account?
          <a href="signup.html" class="auth-link auth-link--strong">Create one</a>
        </p>
      </section>
    </main>
  </div>

  <script src="../scripts/validation.js"></script>
  <script src="../scripts/auth.js"></script>
  <script>
    document.addEventListener("DOMContentLoaded", function () {
      MindBloomAuthPages.initLoginPage();
    });
  </script>
</body>
</html>
