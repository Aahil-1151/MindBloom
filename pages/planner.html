<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Smart Planner — MindBloom</title>

  <link rel="stylesheet" href="../styles/variables.css" />
  <link rel="stylesheet" href="../styles/global.css" />
  <link rel="stylesheet" href="../styles/animations.css" />
  <link rel="stylesheet" href="../styles/components.css" />
  <link rel="stylesheet" href="../styles/shell.css" />
  <link rel="stylesheet" href="../styles/responsive.css" />
  <link rel="stylesheet" href="../styles/pages/planner.css" />
</head>
<body>
  <div id="app" class="planner-shell">

    <!-- ============ SIDEBAR (tablet/desktop) ============ -->
    <aside class="sidebar hide-mobile" id="sidebar">
      <div class="sidebar__brand">
        <div class="auth-brand__mark"><svg class="icon" aria-hidden="true"><use href="../assets/icons/icons.svg#icon-leaf"></use></svg></div>
        <span class="sidebar__brand-name">MindBloom</span>
      </div>

      <nav class="sidebar__nav">
        <a href="dashboard.html" class="sidebar__link" data-nav="home">
          <span class="sidebar__icon"><svg class="icon" aria-hidden="true"><use href="../assets/icons/icons.svg#icon-home"></use></svg></span> Home
        </a>
        <a href="physical.html" class="sidebar__link" data-nav="wellbeing">
          <span class="sidebar__icon"><svg class="icon" aria-hidden="true"><use href="../assets/icons/icons.svg#icon-heart"></use></svg></span> Wellbeing
        </a>
        <a href="planner.html" class="sidebar__link" data-nav="academic">
          <span class="sidebar__icon"><svg class="icon" aria-hidden="true"><use href="../assets/icons/icons.svg#icon-cap"></use></svg></span> Academic
        </a>
        <a href="chat.html" class="sidebar__link" data-nav="bloom">
          <span class="sidebar__icon"><svg class="icon" aria-hidden="true"><use href="../assets/icons/icons.svg#icon-chat"></use></svg></span> Bloom AI
        </a>
        <a href="analytics.html" class="sidebar__link" data-nav="insights">
          <span class="sidebar__icon"><svg class="icon" aria-hidden="true"><use href="../assets/icons/icons.svg#icon-chart"></use></svg></span> Insights
        </a>
        <a href="settings.html" class="sidebar__link" data-nav="settings">
          <span class="sidebar__icon"><svg class="icon" aria-hidden="true"><use href="../assets/icons/icons.svg#icon-settings"></use></svg></span> Settings
        </a>
      </nav>

      <button class="sidebar__logout" id="sidebar-logout">
        <svg class="icon" aria-hidden="true"><use href="../assets/icons/icons.svg#icon-logout"></use></svg> Log out
      </button>
    </aside>

    <div class="main-area">

    <header class="top-header">
      <h1 class="page-header__title">Smart Planner</h1>
      <button type="button" class="btn btn--icon" id="add-task-btn" aria-label="Add task"><svg class="icon" aria-hidden="true"><use href="../assets/icons/icons.svg#icon-plus"></use></svg></button>
    </header>

    <main class="page planner-page">

      <!-- CALENDAR -->
      <section class="section">
        <div class="calendar card card--elevated" id="calendar-container"></div>
      </section>

      <!-- FOCUS SUGGESTION -->
      <section class="section">
        <div class="focus-card card card--pillar-academic" id="focus-card"></div>
      </section>

      <!-- WORKLOAD METER -->
      <section class="section">
        <div class="workload-meter card" id="workload-meter"></div>
      </section>

      <!-- TASK LIST -->
      <section class="section">
        <div class="section__header planner-list-header">
          <h2 id="list-heading">Today</h2>
          <div class="view-toggle" id="view-toggle">
            <button type="button" class="chip chip--selectable" data-view="day" aria-pressed="true">Selected day</button>
            <button type="button" class="chip chip--selectable" data-view="upcoming" aria-pressed="false">All upcoming</button>
          </div>
        </div>

        <ul class="planner-task-list" id="task-list"></ul>
        <div class="empty-state" id="task-empty" hidden>
          <span class="empty-state__icon"><svg class="icon icon--lg" aria-hidden="true"><use href="../assets/icons/icons.svg#icon-calendar"></use></svg></span>
          <h3>Nothing here</h3>
          <p>Tap the + button to add a task for this day.</p>
        </div>
      </section>

    </main>

      <nav class="nav-bar hide-desktop" id="bottom-nav">
        <a href="dashboard.html" class="nav-item" data-nav="home">
          <svg class="icon" aria-hidden="true"><use href="../assets/icons/icons.svg#icon-home"></use></svg><span>Home</span>
        </a>
        <a href="physical.html" class="nav-item" data-nav="wellbeing">
          <svg class="icon" aria-hidden="true"><use href="../assets/icons/icons.svg#icon-heart"></use></svg><span>Wellbeing</span>
        </a>
        <a href="planner.html" class="nav-item" data-nav="academic">
          <svg class="icon" aria-hidden="true"><use href="../assets/icons/icons.svg#icon-cap"></use></svg><span>Academic</span>
        </a>
        <a href="chat.html" class="nav-item" data-nav="bloom">
          <svg class="icon" aria-hidden="true"><use href="../assets/icons/icons.svg#icon-chat"></use></svg><span>Bloom</span>
        </a>
        <a href="analytics.html" class="nav-item" data-nav="insights">
          <svg class="icon" aria-hidden="true"><use href="../assets/icons/icons.svg#icon-chart"></use></svg><span>Insights</span>
        </a>
      </nav>
    </div>
  </div>

  <!-- ADD / EDIT TASK MODAL -->
  <div class="modal-overlay" id="task-modal-overlay" hidden>
    <div class="modal-sheet" role="dialog" aria-modal="true" aria-labelledby="modal-title">
      <div class="modal-sheet__handle"></div>
      <h2 id="modal-title">New task</h2>

      <form id="task-form" class="stack planner-form">
        <div class="field" data-field="title">
          <label class="field__label" for="task-title">Title</label>
          <input class="input" type="text" id="task-title" name="title" placeholder="e.g. Finish chem lab report" required />
        </div>

        <div class="field" data-field="subject">
          <label class="field__label" for="task-subject">Subject</label>
          <input class="input" type="text" id="task-subject" name="subject" placeholder="e.g. Chemistry" />
        </div>

        <div class="planner-form__row">
          <div class="field" data-field="dueDate">
            <label class="field__label" for="task-due">Due date</label>
            <input class="input" type="date" id="task-due" name="dueDate" required />
          </div>

          <div class="field" data-field="priority">
            <label class="field__label" for="task-priority">Priority</label>
            <select class="select" id="task-priority" name="priority">
              <option value="low">Low</option>
              <option value="medium" selected>Medium</option>
              <option value="high">High</option>
            </select>
          </div>
        </div>

        <div class="field" data-field="estimatedMinutes">
          <label class="field__label" for="task-minutes">Estimated time (minutes)</label>
          <input class="input" type="number" id="task-minutes" name="estimatedMinutes" min="5" step="5" value="30" />
        </div>

        <div class="field" data-field="notes">
          <label class="field__label" for="task-notes">Notes (optional)</label>
          <textarea class="textarea planner-form__notes" id="task-notes" name="notes" placeholder="Any extra detail…"></textarea>
        </div>

        <div class="planner-form__actions">
          <button type="button" class="btn btn--ghost" id="modal-cancel">Cancel</button>
          <button type="submit" class="btn btn--primary">Save task</button>
        </div>
      </form>
    </div>
  </div>

  <div id="toast-root" class="toast-root"></div>

  <script src="../scripts/core/utils.js"></script>
  <script src="../scripts/auth.js"></script>
  <script src="../scripts/task-manager.js"></script>
  <script src="../scripts/priority-engine.js"></script>
  <script src="../scripts/calendar.js"></script>
  <script src="../scripts/planner.js"></script>
</body>
</html>
